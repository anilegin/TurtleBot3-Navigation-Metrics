adaptive_controller:
  ros__parameters:
    controller_node: "/controller_server"

    normal_max_velocity: 0.26
    reduced_max_velocity: 0.20
    stuck_threshold: 4

    normal_goal_tolerance: 0.15
    relaxed_goal_tolerance: 0.25
    goal_struggle_threshold: 10

    normal_inflation_radius: 0.30
    conservative_inflation_radius: 0.35
    bad_efficiency_threshold: 8

    normal_cost_scaling_factor: 3.0
    complex_cost_scaling_factor: 3.5
    complex_environment_threshold: 8

    # only used for detecting narrow-stuck, not for slowing normal navigation
    narrow_passage_threshold: 3
    narrow_stuck_threshold: 10

    # recovery close to native values
    recovery_max_velocity: 0.20
    recovery_min_velocity: 0.00
    recovery_max_theta_velocity: 0.80
    recovery_inflation_radius: 0.30
    recovery_cost_scaling_factor: 3.0

    wall_escape_forward_distance: 0.30
    wall_escape_lateral_offset: 0.25
    wall_escape_close_threshold: 0.45
    wall_escape_clear_threshold: 0.70
    wall_escape_progress_threshold: 0.002
    wall_escape_min_interval: 6.0
    use_wall_escape: True